<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Digital Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .color-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }
    .color-dot.selected {
      border-color: #3b82f6;
      transform: scale(1.15);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
    .action-card {
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .action-card.selected {
      border-color: #3b82f6;
      background-color: rgba(59, 130, 246, 0.2);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    /* ANIMAZIONE INTRO LOGO (ZOOM & FADE) */
    @keyframes logoZoomIntro {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
      80% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #splash-logo {
      animation: logoZoomIntro 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- SCHERMATA D'INTRODUZIONE ANIMATA -->
  <div id="splash-screen">
    <img id="splash-logo" src="https://i.postimg.cc/FzNcsbRK/1774642979070-(1).png" class="w-44 h-44 object-contain drop-shadow-2xl" alt="Logo Intro">
  </div>

  <!-- CONTENITORE PRINCIPALE -->
  <div id="app" class="w-full max-w-md opacity-0 transition-opacity duration-700"></div>

  <script>
    const LOGO_URL = "https://i.postimg.cc/FzNcsbRK/1774642979070-(1).png";

    // PALETTE COLORI PREDEFINITI
    let ALLOWED_COLORS = [
      { name: 'Beige', hex: '#f5f5dc' },
      { name: 'Blu', hex: '#1e3a8a' },
      { name: 'Bianco', hex: '#ffffff' },
      { name: 'Nero', hex: '#000000' },
      { name: 'Oro', hex: '#d4af37' },
      { name: 'Rosso', hex: '#dc2626' },
      { name: 'Viola', hex: '#7e22ce' }
    ];

    let colorAssignments = {
      bg: '#f5f5dc',      // Default Sfondo: Beige
      accent: '#ffffff',  // Default Pulsanti: Bianco
      text: '#0f172a'     // Default Testo: Scuro
    };

    let activeColorTarget = 'bg';
    let currentMode = 'card';
    let uploadedImageBase64 = "";

    // GESTIONE INTRO ANIMATA
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        const app = document.getElementById('app');
        if (splash) {
          splash.style.opacity = '0';
          splash.style.visibility = 'hidden';
        }
        if (app) {
          app.classList.remove('opacity-0');
        }
      }, 2000); // Durata intro: 2 secondi
    });

    // HELPER ENCODING BASE64 (UTF-8 SAFE)
    function utf8_to_b64(str) {
      return window.btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
        return String.fromCharCode('0x' + p1);
      }));
    }

    function b64_to_utf8(str) {
      return decodeURIComponent(Array.prototype.map.call(window.atob(str), function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
    }

    // RIDIMENSIONA IMMAGINE PER NFC (< 50KB)
    function processAndResizeImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 300;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          const resizedBase64 = canvas.toDataURL('image/jpeg', 0.65);
          callback(resizedBase64);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // LEGGI PARAMETRI DALL'URL
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const dataEncoded = urlParams.get('data');

    // ROUTING VISTE
    if (mode && dataEncoded) {
      try {
        const config = JSON.parse(b64_to_utf8(dataEncoded));
        renderPublicView(mode, config);
      } catch (e) {
        console.error("Errore decodifica dati URL:", e);
        renderConfigurator();
      }
    } else {
      renderConfigurator();
    }

    // --- VISTA PUBBLICA ---
    function renderPublicView(mode, config) {
      const app = document.getElementById('app');

      const bgColor = config.colorAssignments?.bg || (config.colors && config.colors[0]) || '#f5f5dc';
      const accentColor = config.colorAssignments?.accent || (config.colors && config.colors[1]) || '#ffffff';
      const textColor = config.colorAssignments?.text || (config.colors && config.colors[2]) || '#0f172a';

      document.body.style.backgroundColor = bgColor;

      if (mode === 'redirect') {
        let dest = config.url || '';
        if (dest && !dest.startsWith('http://') && !dest.startsWith('https://')) {
          dest = 'https://' + dest;
        }
        if (dest) window.location.href = dest;
        app.innerHTML = `<div class="bg-slate-800 p-8 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
          <i class="fas fa-spinner fa-spin text-4xl text-blue-400 mb-4"></i>
          <p class="text-base font-semibold">Reindirizzamento in corso...</p>
        </div>`;
        return;
      }

      if (mode === 'call') {
        const phone = config.phone || '';
        if (phone) window.location.href = 'tel:' + phone;
        app.innerHTML = `<div class="bg-slate-800 p-8 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
          <i class="fas fa-phone text-4xl text-green-400 mb-4"></i>
          <p class="text-base font-semibold">Avvio chiamata a ${phone}...</p>
        </div>`;
        return;
      }

      if (mode === 'whatsapp') {
        const num = (config.waNum || '').replace(/[^0-9]/g, '');
        const msg = encodeURIComponent(config.waMsg || '');
        const waUrl = `https://wa.me/${num}${msg ? '?text=' + msg : ''}`;
        window.location.href = waUrl;
        app.innerHTML = `<div class="bg-slate-800 p-8 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
          <i class="fab fa-whatsapp text-4xl text-green-500 mb-4"></i>
          <p class="text-base font-semibold">Apertura Chat WhatsApp...</p>
        </div>`;
        return;
      }

      if (mode === 'photo') {
        app.innerHTML = `
          <div class="bg-slate-800 p-5 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
            <img src="${config.photoUrl}" class="w-full rounded-2xl mb-4 object-cover max-h-[70vh]" alt="Foto" onerror="this.onerror=null;this.src='https://via.placeholder.com/400?text=Immagine+non+trovata';">
            <a href="${window.location.pathname}" class="inline-block mt-2 text-xs text-slate-400 hover:text-white transition">Configura nuovo Tag</a>
          </div>`;
        return;
      }

      if (mode === 'pdf') {
        let pdfDest = config.pdfUrl || '#';
        if (pdfDest !== '#' && !pdfDest.startsWith('http://') && !pdfDest.startsWith('https://')) {
          pdfDest = 'https://' + pdfDest;
        }
        app.innerHTML = `
          <div class="bg-slate-800 p-6 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
            <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
              <i class="fas fa-file-pdf"></i>
            </div>
            <h2 class="text-xl font-bold mb-4">${config.pdfTitle || 'Documento PDF'}</h2>
            <a href="${pdfDest}" target="_blank" rel="noopener noreferrer" class="block w-full py-3.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl shadow-lg transition">
              <i class="fas fa-download mr-2"></i> Apri / Scarica PDF
            </a>
            <div class="mt-6 pt-4 border-t border-slate-700">
              <a href="${window.location.pathname}" class="text-xs text-slate-400 hover:text-white transition">Configura nuovo Tag</a>
            </div>
          </div>`;
        return;
      }

      // BIGLIETTO DA VISITA
      if (mode === 'card') {
        let socialLinksHTML = '';
        if (config.instagram) socialLinksHTML += createSocialBtn(`https://instagram.com/${config.instagram.replace('@','')}`, 'fab fa-instagram', 'Instagram', accentColor, textColor);
        if (config.tiktok) socialLinksHTML += createSocialBtn(`https://tiktok.com/@${config.tiktok.replace('@','')}`, 'fab fa-tiktok', 'TikTok', accentColor, textColor);
        if (config.whatsapp) socialLinksHTML += createSocialBtn(`https://wa.me/${config.whatsapp.replace(/[^0-9]/g,'')}`, 'fab fa-whatsapp', 'WhatsApp', accentColor, textColor);
        if (config.linkedin) {
          let lUrl = config.linkedin;
          if (!lUrl.startsWith('http')) lUrl = 'https://' + lUrl;
          socialLinksHTML += createSocialBtn(lUrl, 'fab fa-linkedin', 'LinkedIn', accentColor, textColor);
        }

        const avatarImg = config.avatarUrl;
        const avatarHTML = avatarImg 
          ? `<img src="${avatarImg}" class="w-24 h-24 rounded-full mx-auto mb-4 object-cover border-4 border-slate-900/20 shadow-lg">`
          : `<div class="w-24 h-24 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl font-bold shadow-lg" style="background:${accentColor}; color:${textColor}">${(config.name || 'U')[0]}</div>`;

        app.innerHTML = `
          <div class="glass p-6 rounded-3xl shadow-2xl text-center border border-slate-900/10" style="color:${textColor}">
            ${avatarHTML}
            <h1 class="text-2xl font-bold tracking-tight">${config.name || 'Nome Cognome'}</h1>
            <p class="text-sm opacity-80 mb-6 font-medium">${config.title || ''}</p>

            <div class="space-y-3 mb-6">
              ${config.phone ? `<a href="tel:${config.phone}" class="block w-full py-3 px-4 rounded-xl bg-slate-900/10 hover:bg-slate-900/20 transition flex items-center justify-center gap-2 font-medium" style="border:1px solid ${textColor}30"><i class="fas fa-phone text-sm opacity-70"></i> ${config.phone}</a>` : ''}
              ${config.email ? `<a href="mailto:${config.email}" class="block w-full py-3 px-4 rounded-xl bg-slate-900/10 hover:bg-slate-900/20 transition flex items-center justify-center gap-2 font-medium break-all" style="border:1px solid ${textColor}30"><i class="fas fa-envelope text-sm opacity-70"></i> ${config.email}</a>` : ''}
            </div>

            ${socialLinksHTML ? `<div class="flex flex-col gap-2.5 mb-6">${socialLinksHTML}</div>` : ''}

            <button onclick="downloadVCard('${escapeJsStr(config.name)}', '${escapeJsStr(config.phone)}', '${escapeJsStr(config.email)}')" class="w-full py-3.5 rounded-xl font-bold shadow-lg transition hover:brightness-110 active:scale-95" style="background:${accentColor}; color:${textColor}; border: 1px solid ${textColor}20">
              <i class="fas fa-user-plus mr-2"></i> Salva in Rubrica
            </button>

            <div class="mt-6 pt-4 border-t border-slate-900/10">
              <a href="${window.location.pathname}" class="text-xs opacity-60 hover:opacity-100 transition font-semibold">Crea il tuo profilo NFC</a>
            </div>
          </div>
        `;
      }
    }

    function escapeJsStr(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function createSocialBtn(url, iconClass, label, accentColor, textColor) {
      return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="w-full py-3 px-4 rounded-xl bg-slate-900/10 hover:bg-slate-900/20 transition flex items-center justify-between font-medium" style="border: 1px solid ${textColor}30">
                <span class="flex items-center gap-3"><i class="${iconClass} text-xl"></i> ${label}</span>
                <i class="fas fa-external-link-alt text-xs opacity-50"></i>
              </a>`;
    }

    function downloadVCard(name, phone, email) {
      const vcard = `BEGIN:VCARD\nVERSION:3.0\nN:;${name || ''};;;\nFN:${name || ''}\nTEL;TYPE=CELL:${phone || ''}\nEMAIL:${email || ''}\nEND:VCARD`;
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(name || 'contatto').replace(/\s+/g, '_')}.vcf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }

    // --- CONFIGURATORE ---
    function renderConfigurator() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="bg-slate-800 p-6 rounded-3xl shadow-2xl border border-slate-700">
          
          <!-- LOGO INGRANDITO E TITOLO COMPATTO -->
          <div class="flex items-center gap-3 mb-6">
            <img src="${LOGO_URL}" class="w-32 h-32 sm:w-36 sm:h-36 object-contain shrink-0 drop-shadow-xl" alt="Logo">
            <div class="min-w-0 flex-1">
              <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight leading-tight">Configuratore Tag NFC</h1>
              <p class="text-xs text-slate-400 mt-1 leading-snug">Scegli cosa mostrare quando il tag viene scansionato</p>
            </div>
          </div>

          <label class="block text-xs font-bold text-slate-300 mb-2">SELEZIONA AZIONE</label>
          
          <!-- SELEZIONE AZIONI MODERNE -->
          <div class="grid grid-cols-2 gap-2.5 mb-5">
            <button type="button" onclick="selectAction('card')" id="btn-card" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-address-card"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Biglietto da Visita</span>
            </button>

            <button type="button" onclick="selectAction('redirect')" id="btn-redirect" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-link"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Link Diretto</span>
            </button>

            <button type="button" onclick="selectAction('call')" id="btn-call" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-phone"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Contatto Telefonico</span>
            </button>

            <button type="button" onclick="selectAction('whatsapp')" id="btn-whatsapp" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-green-500/20 text-green-400 flex items-center justify-center text-sm shrink-0"><i class="fab fa-whatsapp"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Chat WhatsApp</span>
            </button>

            <button type="button" onclick="selectAction('photo')" id="btn-photo" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-image"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Immagine / Foto</span>
            </button>

            <button type="button" onclick="selectAction('pdf')" id="btn-pdf" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center justify-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-file-pdf"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">File PDF</span>
            </button>
          </div>

          <!-- FORM DYNAMIC FIELDS -->
          <div id="formFields" class="space-y-3"></div>

          <!-- SEZIONE ASSEGNAZIONE COLORI -->
          <div id="colorSection" class="pt-4 border-t border-slate-700 mt-4">
            <label class="block text-xs font-bold text-slate-300 mb-2">🎨 SELEZIONA DESTINAZIONE COLORE</label>
            
            <!-- SELEZIONE TARGET -->
            <div class="grid grid-cols-3 gap-2 mb-3">
              <button type="button" onclick="setTarget('bg')" id="target-bg" class="py-2 px-1 text-[11px] font-bold rounded-xl border border-slate-700 bg-blue-600/30 border-blue-500 text-blue-300 flex flex-col items-center gap-1">
                <span>Sfondo</span>
                <span id="preview-bg" class="w-4 h-4 rounded-full border border-white/40" style="background-color: ${colorAssignments.bg}"></span>
              </button>
              <button type="button" onclick="setTarget('accent')" id="target-accent" class="py-2 px-1 text-[11px] font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400 flex flex-col items-center gap-1">
                <span>Pulsanti</span>
                <span id="preview-accent" class="w-4 h-4 rounded-full border border-white/40" style="background-color: ${colorAssignments.accent}"></span>
              </button>
              <button type="button" onclick="setTarget('text')" id="target-text" class="py-2 px-1 text-[11px] font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400 flex flex-col items-center gap-1">
                <span>Testi</span>
                <span id="preview-text" class="w-4 h-4 rounded-full border border-white/40" style="background-color: ${colorAssignments.text}"></span>
              </button>
            </div>

            <p class="text-[10px] text-slate-400 mb-3 text-center">Tocca un elemento sopra, poi seleziona il colore o crealo su misura:</p>

            <div id="colorDotsContainer" class="flex flex-wrap gap-3 justify-center bg-slate-900 p-3 rounded-xl border border-slate-700 mb-3"></div>

            <!-- PULSANTE SELETTORE COLORE PERSONALIZZATO -->
            <div class="text-center">
              <input type="color" id="customColorPicker" onchange="handleCustomColorChoice(event)" class="hidden">
              <button type="button" onclick="document.getElementById('customColorPicker').click()" class="w-full py-2.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-90 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition shadow-md active:scale-95">
                <i class="fas fa-palette"></i> Personalizza il tuo colore (16M di Colori)
              </button>
            </div>
          </div>

          <button onclick="generateLink()" class="w-full mt-6 py-3.5 bg-blue-600 hover:bg-blue-500 font-bold text-white rounded-xl shadow-lg transition active:scale-95">
            Genera Link per Tag NFC
          </button>

          <!-- RESULT AREA -->
          <div id="resultArea" class="hidden mt-6 pt-5 border-t border-slate-700 text-center">
            <p class="text-xs text-slate-400 mb-2">Link generato con successo:</p>
            <input type="text" id="generatedUrl" readonly class="w-full p-3 bg-slate-900 rounded-xl text-xs text-blue-400 border border-slate-700 mb-3 text-center font-mono">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
              <button onclick="copyUrl()" class="py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                <i class="fas fa-copy"></i> Copia Link
              </button>
              <button onclick="testGeneratedUrl()" class="py-2.5 bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 border border-blue-500/30">
                <i class="fas fa-external-link-alt"></i> Prova Link
              </button>
            </div>

            <!-- TASTO SCRITTURA DIRETTA NFC -->
            <button onclick="writeToNfcTag()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 active:scale-95">
              <i class="fas fa-wifi text-lg"></i> Scrivi su Tag NFC
            </button>
            <p id="nfcStatus" class="text-[11px] text-slate-400 mt-2 font-medium"></p>
          </div>
        </div>
      `;
      renderColorDots();
      selectAction('card');
    }

    function setTarget(targetKey) {
      activeColorTarget = targetKey;
      ['bg', 'accent', 'text'].forEach(t => {
        const btn = document.getElementById(`target-${t}`);
        if (btn) {
          if (t === targetKey) {
            btn.className = "py-2 px-1 text-[11px] font-bold rounded-xl border border-blue-500 bg-blue-600/30 text-blue-300 flex flex-col items-center gap-1";
          } else {
            btn.className = "py-2 px-1 text-[11px] font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400 flex flex-col items-center gap-1";
          }
        }
      });
      renderColorDots();
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        processAndResizeImage(file, function(resizedBase64) {
          uploadedImageBase64 = resizedBase64;
          const previewImg = document.getElementById('imagePreview');
          const previewContainer = document.getElementById('imagePreviewContainer');
          if (previewImg && previewContainer) {
            previewImg.src = resizedBase64;
            previewContainer.classList.remove('hidden');
          }
        });
      }
    }

    function handleCustomColorChoice(event) {
      const customHex = event.target.value;
      if (!ALLOWED_COLORS.some(c => c.hex === customHex)) {
        ALLOWED_COLORS.push({ name: 'Personalizzato', hex: customHex });
      }
      assignColor(customHex);
    }

    function selectAction(modeKey) {
      currentMode = modeKey;
      document.querySelectorAll('.action-card').forEach(btn => btn.classList.remove('selected'));
      const activeBtn = document.getElementById(`btn-${modeKey}`);
      if (activeBtn) activeBtn.classList.add('selected');
      toggleFields();
    }

    function renderColorDots() {
      const container = document.getElementById('colorDotsContainer');
      if (!container) return;
      container.innerHTML = ALLOWED_COLORS.map(c => {
        const isAssigned = colorAssignments[activeColorTarget] === c.hex;
        return `
          <div 
            onclick="assignColor('${c.hex}')" 
            class="color-dot ${isAssigned ? 'selected' : ''}" 
            style="background-color: ${c.hex}; ${c.hex === '#ffffff' ? 'border-color:#cbd5e1' : ''}" 
            title="${c.name}">
          </div>
        `;
      }).join('');
    }

    function assignColor(hex) {
      colorAssignments[activeColorTarget] = hex;
      const prevEl = document.getElementById(`preview-${activeColorTarget}`);
      if (prevEl) prevEl.style.backgroundColor = hex;
      renderColorDots();
    }

    function toggleFields() {
      const type = currentMode;
      const container = document.getElementById('formFields');
      const resArea = document.getElementById('resultArea');
      if (resArea) resArea.classList.add('hidden');

      if (type === 'card') {
        container.innerHTML = `
          <input type="text" id="c_name" placeholder="Nome e Cognome" class="input-style">
          <input type="text" id="c_title" placeholder="Ruolo / Professione" class="input-style">
          <input type="tel" id="c_phone" placeholder="Numero di Telefono" class="input-style">
          <input type="email" id="c_email" placeholder="Email" class="input-style">
          
          <div class="pt-2 border-t border-slate-700">
            <label class="block text-xs font-bold text-slate-300 mb-1">📷 FOTO PROFILO (CERCHIETTO)</label>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
            <button type="button" onclick="document.getElementById('imageInput').click()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 text-xs font-bold flex items-center justify-center gap-2 transition">
              <i class="fas fa-upload text-blue-400"></i> Seleziona Foto dal Telefono/PC
            </button>
            <div id="imagePreviewContainer" class="${uploadedImageBase64 ? '' : 'hidden'} mt-2 text-center">
              <img id="imagePreview" src="${uploadedImageBase64}" class="w-16 h-16 object-cover rounded-full mx-auto border-2 border-blue-500 shadow-md mb-1">
              <p class="text-[10px] text-emerald-400 font-semibold">✓ Foto profilo pronta per il cerchietto</p>
            </div>
          </div>

          <div class="pt-3 border-t border-slate-700 space-y-2">
            <p class="text-xs text-slate-400 font-semibold mb-1">Social Network:</p>
            <input type="text" id="c_insta" placeholder="Username Instagram" class="input-style">
            <input type="text" id="c_tiktok" placeholder="Username TikTok" class="input-style">
            <input type="text" id="c_wa" placeholder="Numero WhatsApp (es. 393331234567)" class="input-style">
            <input type="text" id="c_linkedin" placeholder="Link o Username LinkedIn" class="input-style">
          </div>
        `;
      } else if (type === 'redirect') {
        container.innerHTML = `<input type="url" id="r_url" placeholder="Incolla il link (https://...)" class="input-style">`;
      } else if (type === 'call') {
        container.innerHTML = `<input type="tel" id="p_phone" placeholder="Numero di telefono da chiamare" class="input-style">`;
      } else if (type === 'whatsapp') {
        container.innerHTML = `
          <input type="tel" id="wa_num" placeholder="Numero WhatsApp (es. 393331234567)" class="input-style">
          <textarea id="wa_msg" placeholder="Messaggio preimpostato (opzionale)" class="input-style h-20 resize-none"></textarea>
        `;
      } else if (type === 'photo') {
        container.innerHTML = `<input type="url" id="img_url" placeholder="Link immagine (http://...)" class="input-style">`;
      } else if (type === 'pdf') {
        container.innerHTML = `
          <input type="text" id="pdf_title" placeholder="Titolo Documento" class="input-style">
          <input type="url" id="pdf_url" placeholder="Link al file PDF (Drive, Dropbox, ecc.)" class="input-style">
        `;
      }

      document.querySelectorAll('.input-style').forEach(el => {
        el.className = "w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition";
      });
    }

    function generateLink() {
      const type = currentMode;
      let payload = { colorAssignments: colorAssignments };

      if (type === 'card') {
        payload = {
          ...payload,
          avatarUrl: uploadedImageBase64,
          name: document.getElementById('c_name')?.value || '',
          title: document.getElementById('c_title')?.value || '',
          phone: document.getElementById('c_phone')?.value || '',
          email: document.getElementById('c_email')?.value || '',
          instagram: document.getElementById('c_insta')?.value || '',
          tiktok: document.getElementById('c_tiktok')?.value || '',
          whatsapp: document.getElementById('c_wa')?.value || '',
          linkedin: document.getElementById('c_linkedin')?.value || ''
        };
      } else if (type === 'redirect') {
        payload.url = document.getElementById('r_url')?.value || '';
      } else if (type === 'call') {
        payload.phone = document.getElementById('p_phone')?.value || '';
      } else if (type === 'whatsapp') {
        payload.waNum = document.getElementById('wa_num')?.value || '';
        payload.waMsg = document.getElementById('wa_msg')?.value || '';
      } else if (type === 'photo') {
        payload.photoUrl = document.getElementById('img_url')?.value || '';
      } else if (type === 'pdf') {
        payload.pdfTitle = document.getElementById('pdf_title')?.value || '';
        payload.pdfUrl = document.getElementById('pdf_url')?.value || '';
      }

      const jsonStr = JSON.stringify(payload);
      const encoded = utf8_to_b64(jsonStr);
      
      const baseUrl = window.location.href.split('?')[0];
      const finalUrl = `${baseUrl}?mode=${type}&data=${encoded}`;

      const resArea = document.getElementById('resultArea');
      document.getElementById('generatedUrl').value = finalUrl;
      resArea.classList.remove('hidden');

      setTimeout(() => {
        resArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 100);
    }

    function copyUrl() {
      const copyText = document.getElementById("generatedUrl");
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyText.value).then(() => {
          alert("Link copiato negli appunti!");
        }).catch(() => {
          document.execCommand("copy");
          alert("Link copiato negli appunti!");
        });
      } else {
        document.execCommand("copy");
        alert("Link copiato negli appunti!");
      }
    }

    function testGeneratedUrl() {
      const url = document.getElementById('generatedUrl').value;
      if (url) window.open(url, '_blank');
    }

    // INTERAZIONE CON TAG NFC (WEB NFC API)
    async function writeToNfcTag() {
      const statusEl = document.getElementById('nfcStatus');
      const urlToWrite = document.getElementById('generatedUrl').value;

      if (!urlToWrite) {
        alert("Genera prima un link valido!");
        return;
      }

      if ('NDEFReader' in window) {
        try {
          statusEl.innerText = "Avvicina il Tag NFC al retro del telefono...";
          statusEl.className = "text-[11px] text-amber-400 mt-2 font-semibold animate-pulse";

          const ndef = new NDEFReader();
          await ndef.write({
            records: [{ recordType: "url", data: urlToWrite }]
          });

          statusEl.innerText = " Scrittura su Tag NFC completata con successo!";
          statusEl.className = "text-[11px] text-emerald-400 mt-2 font-bold";
        } catch (error) {
          console.error("Errore scrittura NFC:", error);
          statusEl.innerText = " Errore durante la scrittura: " + error.message;
          statusEl.className = "text-[11px] text-red-400 mt-2 font-medium";
        }
      } else {
        alert("Il tuo browser/dispositivo non supporta la scrittura Web NFC diretta (richiede Chrome/Android). Puoi comunque copiare il link e scriverlo con l'app NFC Tools!");
        statusEl.innerText = "Web NFC non supportato su questo browser. Usa l'app NFC Tools.";
        statusEl.className = "text-[11px] text-amber-400 mt-2 font-medium";
      }
    }
  </script>
</body>
</html>
