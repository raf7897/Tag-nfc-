<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Digital Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SUPABASE JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .color-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }
    .color-dot.selected {
      border-color: #3b82f6;
      transform: scale(1.15);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
    .action-card {
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .action-card.selected {
      border-color: #3b82f6;
      background-color: rgba(59, 130, 246, 0.2);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    @keyframes logoZoomIntro {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.15); opacity: 1; }
      80% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #splash-logo {
      animation: logoZoomIntro 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- SCHERMATA INTRO LOGO -->
  <div id="splash-screen" class="hidden">
    <img id="splash-logo" src="https://i.postimg.cc/FzNcsbRK/1774642979070-(1).png" class="w-44 h-44 object-contain drop-shadow-2xl" alt="Logo Intro">
  </div>

  <!-- CONTENITORE PRINCIPALE -->
  <div id="app" class="w-full max-w-md">
    <div class="text-center p-8">
      <i class="fas fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
      <p class="text-sm font-semibold text-slate-400">Caricamento in corso...</p>
    </div>
  </div>

  <script>
    // CONFIGURAZIONE SUPABASE
    const SUPABASE_URL = "https://ohejaljifhahlxvwxzlo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oZWphbGppZmhhaGx4dnd4emxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODY1NDEsImV4cCI6MjEwNTQ2MjU0MX0.tB3jyngcfRGZuPTz41ZxhXzIk6UMriWtsGvBZVRNvW4";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const LOGO_URL = "https://i.postimg.cc/FzNcsbRK/1774642979070-(1).png";

    let ALLOWED_COLORS = [
      { name: 'Beige', hex: '#f5f5dc' },
      { name: 'Blu', hex: '#1e3a8a' },
      { name: 'Bianco', hex: '#ffffff' },
      { name: 'Nero', hex: '#000000' },
      { name: 'Oro', hex: '#d4af37' },
      { name: 'Rosso', hex: '#dc2626' },
      { name: 'Viola', hex: '#7e22ce' }
    ];

    let colorAssignments = { bg: '#f5f5dc', accent: '#ffffff', text: '#0f172a' };
    let activeColorTarget = 'bg';
    let currentMode = 'card';
    let uploadedImageBase64 = "";

    // PARAMETRI URL
    const urlParams = new URLSearchParams(window.location.search);
    const tagId = urlParams.get('id') || 'default-tag';

    // AVVIO
    window.addEventListener('DOMContentLoaded', async () => {
      await loadTagFromDatabase(tagId);
    });

    async function loadTagFromDatabase(id) {
      const app = document.getElementById('app');
      try {
        const { data, error } = await _supabase
          .from('tags')
          .select('*')
          .eq('tag_id', id)
          .single();

        if (error && error.code !== 'PGRST116') {
          console.error("Errore Supabase:", error);
        }

        if (!data) {
          // TAG NON ANCORA REGISTRATO: MOSTRA CONFIGURATORE SEMPLICE
          startConfiguratorWithSplash(id);
        } else {
          // TAG GIÀ CONFIGURATO: MOSTRA DIRECTLY LA SCHEDA PUBBLICA
          renderPublicCard(data);
        }
      } catch (err) {
        console.error("Errore caricamento:", err);
        startConfiguratorWithSplash(id);
      }
    }

    function startConfiguratorWithSplash(id) {
      const splash = document.getElementById('splash-screen');
      const app = document.getElementById('app');
      
      if (splash && app) {
        splash.classList.remove('hidden');
        app.classList.add('opacity-0');
        renderConfiguratorForm(id, null, null);

        setTimeout(() => {
          splash.style.opacity = '0';
          splash.style.visibility = 'hidden';
          app.classList.remove('opacity-0');
          app.classList.add('transition-opacity', 'duration-500');
        }, 1800);
      } else {
        renderConfiguratorForm(id, null, null);
      }
    }

    // --- CONFIGURATORE FACILE ---
    function renderConfiguratorForm(id, pin, existingData) {
      const app = document.getElementById('app');

      if (existingData) {
        if (existingData.colorAssignments) colorAssignments = existingData.colorAssignments;
        if (existingData.avatarUrl) uploadedImageBase64 = existingData.avatarUrl;
        if (existingData.mode) currentMode = existingData.mode;
      }

      app.innerHTML = `
        <div class="bg-slate-800 p-6 rounded-3xl shadow-2xl border border-slate-700">
          
          <div class="flex items-center gap-3 mb-6">
            <img src="${LOGO_URL}" class="w-28 h-28 object-contain shrink-0 drop-shadow-xl" alt="Logo">
            <div class="min-w-0 flex-1">
              <h1 class="text-xl font-bold text-white tracking-tight">Configura Tag NFC</h1>
              <p class="text-xs text-slate-400 mt-1">Personalizza la tua pagina digitale</p>
            </div>
          </div>

          <label class="block text-xs font-bold text-slate-300 mb-2">SELEZIONA AZIONE</label>
          
          <div class="grid grid-cols-2 gap-2.5 mb-5">
            <button type="button" onclick="selectAction('card')" id="btn-card" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-address-card"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Biglietto da Visita</span>
            </button>

            <button type="button" onclick="selectAction('redirect')" id="btn-redirect" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-link"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Link Diretto</span>
            </button>

            <button type="button" onclick="selectAction('call')" id="btn-call" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-phone"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Contatto Telefonico</span>
            </button>

            <button type="button" onclick="selectAction('whatsapp')" id="btn-whatsapp" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-green-500/20 text-green-400 flex items-center justify-center text-sm shrink-0"><i class="fab fa-whatsapp"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Chat WhatsApp</span>
            </button>

            <button type="button" onclick="selectAction('photo')" id="btn-photo" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-image"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">Immagine / Foto</span>
            </button>

            <button type="button" onclick="selectAction('pdf')" id="btn-pdf" class="action-card p-3 rounded-2xl bg-slate-900/60 text-left flex items-center justify-center gap-3 active:scale-95">
              <div class="w-8 h-8 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center text-sm shrink-0"><i class="fas fa-file-pdf"></i></div>
              <span class="text-xs font-semibold leading-tight text-slate-200">File PDF</span>
            </button>
          </div>

          <!-- FORM CAMPI DINAMICI -->
          <div id="formFields" class="space-y-3 mb-5"></div>

          <!-- SEZIONE COLORI (SOLO PER BIGLIETTO DA VISITA) -->
          <div id="colorSection" class="pt-4 border-t border-slate-700 mb-5">
            <label class="block text-xs font-bold text-slate-300 mb-2">🎨 PERSONALIZZA COLORI</label>
            <div class="grid grid-cols-3 gap-2 mb-3">
              <button type="button" onclick="setTarget('bg')" id="target-bg" class="py-2 px-1 text-[11px] font-bold rounded-xl border border-blue-500 bg-blue-600/30 text-blue-300 flex flex-col items-center gap-1">
                <span>Sfondo</span>
                <span id="preview-bg" class="w-4 h-4 rounded-full border border-white/40" style="background-color: ${colorAssignments.bg}"></span>
              </button>
              <button type="button" onclick="setTarget('accent')" id="target-accent" class="py-2 px-1 text-[11px] font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400 flex flex-col items-center gap-1">
                <span>Pulsanti</span>
                <span id="preview-accent" class="w-4 h-4 rounded-full border border-white/40" style="background-color: ${colorAssignments.accent}"></span>
              </button>
              <button type="button" onclick="setTarget('text')" id="target-text" class="py-2 px-1 text-[11px] font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400 flex flex-col items-center gap-1">
                <span>Testi</span>
                <span id="preview-text" class="w-4 h-4 rounded-full border border-white/40" style="background-color: ${colorAssignments.text}"></span>
              </button>
            </div>

            <div id="colorDotsContainer" class="flex flex-wrap gap-3 justify-center bg-slate-900 p-3 rounded-xl border border-slate-700 mb-3"></div>

            <input type="color" id="customColorPicker" onchange="handleCustomColorChoice(event)" class="hidden">
            <button type="button" onclick="document.getElementById('customColorPicker').click()" class="w-full py-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-90 text-white rounded-xl text-xs font-bold transition shadow-md active:scale-95">
              <i class="fas fa-palette"></i> Personalizza colore (16M)
            </button>
          </div>

          <!-- PIN DI SICUREZZA PER MODIFICHE FUTURE -->
          <div class="pt-4 border-t border-slate-700 mb-5">
            <label class="block text-xs font-bold text-slate-300 mb-1">🔑 PIN DI SICUREZZA (4 Cifre)</label>
            <p class="text-[10px] text-slate-400 mb-2">Ti servirà per modificare la pagina in futuro</p>
            <input type="password" id="userPin" maxlength="4" value="${pin || ''}" placeholder="Inserisci un PIN a 4 cifre (es. 1234)" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-center tracking-widest text-white focus:outline-none focus:border-blue-500">
          </div>

          <button onclick="saveTagToDatabase('${id}')" id="btnSave" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded-xl shadow-lg transition active:scale-95 text-xs mb-3">
            <i class="fas fa-save mr-1.5"></i> Salva Profilo e Attiva Tag
          </button>

          ${existingData ? `
          <button onclick="resetTagInDatabase('${id}')" id="btnReset" class="w-full py-3 bg-red-600/20 hover:bg-red-600/30 text-red-400 font-bold rounded-xl border border-red-500/30 transition active:scale-95 text-xs flex items-center justify-center gap-2">
            <i class="fas fa-trash-alt"></i> Reset Tag (Riporta a pagina iniziale)
          </button>
          ` : ''}
        </div>`;

      selectAction(currentMode);
      renderColorDots();
    }

    function selectAction(modeKey) {
      currentMode = modeKey;
      document.querySelectorAll('.action-card').forEach(btn => btn.classList.remove('selected'));
      const activeBtn = document.getElementById(`btn-${modeKey}`);
      if (activeBtn) activeBtn.classList.add('selected');

      const colorSec = document.getElementById('colorSection');
      if (colorSec) {
        if (modeKey === 'card') {
          colorSec.classList.remove('hidden');
        } else {
          colorSec.classList.add('hidden');
        }
      }

      toggleFields();
    }

    function toggleFields() {
      const type = currentMode;
      const container = document.getElementById('formFields');
      if (!container) return;

      if (type === 'card') {
        container.innerHTML = `
          <input type="text" id="c_name" placeholder="Nome e Cognome" class="input-style">
          <input type="text" id="c_title" placeholder="Ruolo / Professione" class="input-style">
          <input type="tel" id="c_phone" placeholder="Numero di Telefono" class="input-style">
          <input type="email" id="c_email" placeholder="Email" class="input-style">
          
          <div class="pt-2 border-t border-slate-700">
            <label class="block text-xs font-bold text-slate-300 mb-1">📷 FOTO PROFILO</label>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
            <button type="button" onclick="document.getElementById('imageInput').click()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 text-xs font-bold flex items-center justify-center gap-2 transition">
              <i class="fas fa-upload text-blue-400"></i> Seleziona Foto dal Telefono
            </button>
            <div id="imagePreviewContainer" class="${uploadedImageBase64 ? '' : 'hidden'} mt-2 text-center">
              <img id="imagePreview" src="${uploadedImageBase64}" class="w-16 h-16 object-cover rounded-full mx-auto border-2 border-blue-500 shadow-md mb-1">
              <p class="text-[10px] text-emerald-400 font-semibold">✓ Foto caricata</p>
            </div>
          </div>

          <div class="pt-3 border-t border-slate-700 space-y-2">
            <p class="text-xs text-slate-400 font-semibold mb-1">Social Network:</p>
            <input type="text" id="c_insta" placeholder="Username Instagram" class="input-style">
            <input type="text" id="c_tiktok" placeholder="Username TikTok" class="input-style">
            <input type="text" id="c_wa" placeholder="Numero WhatsApp (es. 393331234567)" class="input-style">
            <input type="text" id="c_linkedin" placeholder="Link o Username LinkedIn" class="input-style">
          </div>
        `;
      } else if (type === 'redirect') {
        container.innerHTML = `<input type="url" id="r_url" placeholder="Incolla il link (https://...)" class="input-style">`;
      } else if (type === 'call') {
        container.innerHTML = `<input type="tel" id="p_phone" placeholder="Numero di telefono da chiamare" class="input-style">`;
      } else if (type === 'whatsapp') {
        container.innerHTML = `
          <input type="tel" id="wa_num" placeholder="Numero WhatsApp (es. 393331234567)" class="input-style">
          <textarea id="wa_msg" placeholder="Messaggio preimpostato (opzionale)" class="input-style h-20 resize-none"></textarea>
        `;
      } else if (type === 'photo') {
        container.innerHTML = `<input type="url" id="img_url" placeholder="Link immagine (http://...)" class="input-style">`;
      } else if (type === 'pdf') {
        container.innerHTML = `
          <input type="text" id="pdf_title" placeholder="Titolo Documento" class="input-style">
          <input type="url" id="pdf_url" placeholder="Link al file PDF (Drive, Dropbox, ecc.)" class="input-style">
        `;
      }

      document.querySelectorAll('.input-style').forEach(el => {
        el.className = "w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition";
      });
    }

    // SALVA NEL DATABASE
    async function saveTagToDatabase(id) {
      const pin = document.getElementById('userPin')?.value;
      if (!pin || pin.length < 4) {
        alert("Inserisci un PIN di sicurezza di 4 cifre per proteggere la pagina!");
        return;
      }

      const btnSave = document.getElementById('btnSave');
      btnSave.innerHTML = `<i class="fas fa-circle-notch fa-spin mr-1"></i> Salvataggio in corso...`;
      btnSave.disabled = true;

      const payload = {
        mode: currentMode,
        colorAssignments: colorAssignments,
        name: document.getElementById('c_name')?.value || '',
        title: document.getElementById('c_title')?.value || '',
        phone: document.getElementById('c_phone')?.value || document.getElementById('p_phone')?.value || '',
        email: document.getElementById('c_email')?.value || '',
        avatarUrl: uploadedImageBase64,
        instagram: document.getElementById('c_insta')?.value || '',
        tiktok: document.getElementById('c_tiktok')?.value || '',
        whatsapp: document.getElementById('c_wa')?.value || '',
        linkedin: document.getElementById('c_linkedin')?.value || '',
        url: document.getElementById('r_url')?.value || '',
        waNum: document.getElementById('wa_num')?.value || '',
        waMsg: document.getElementById('wa_msg')?.value || '',
        photoUrl: document.getElementById('img_url')?.value || '',
        pdfTitle: document.getElementById('pdf_title')?.value || '',
        pdfUrl: document.getElementById('pdf_url')?.value || ''
      };

      try {
        const { error } = await _supabase
          .from('tags')
          .upsert({ tag_id: id, pin: pin, data: payload }, { onConflict: 'tag_id' });

        if (error) {
          alert("Errore salvataggio: " + error.message);
          btnSave.innerHTML = `<i class="fas fa-save mr-1.5"></i> Salva Profilo e Attiva Tag`;
          btnSave.disabled = false;
        } else {
          await loadTagFromDatabase(id);
        }
      } catch (err) {
        alert("Errore salvataggio: " + err.message);
        btnSave.innerHTML = `<i class="fas fa-save mr-1.5"></i> Salva Profilo e Attiva Tag`;
        btnSave.disabled = false;
      }
    }

    // RESET DEL TAG NEL DATABASE
    async function resetTagInDatabase(id) {
      const confirmReset = confirm("Sei sicuro di voler resettare questo Tag?\nTutti i dati inseriti verranno cancellati e il Tag tornerà allo stato iniziale.");
      if (!confirmReset) return;

      const btnReset = document.getElementById('btnReset');
      if (btnReset) {
        btnReset.innerHTML = `<i class="fas fa-circle-notch fa-spin mr-1"></i> Reset in corso...`;
        btnReset.disabled = true;
      }

      try {
        const { error } = await _supabase
          .from('tags')
          .delete()
          .eq('tag_id', id);

        if (error) {
          alert("Errore durante il reset: " + error.message);
          if (btnReset) {
            btnReset.innerHTML = `<i class="fas fa-trash-alt"></i> Reset Tag (Riporta a pagina iniziale)`;
            btnReset.disabled = false;
          }
        } else {
          uploadedImageBase64 = "";
          colorAssignments = { bg: '#f5f5dc', accent: '#ffffff', text: '#0f172a' };
          renderConfiguratorForm(id, null, null);
        }
      } catch (err) {
        alert("Errore durante il reset: " + err.message);
        if (btnReset) {
          btnReset.innerHTML = `<i class="fas fa-trash-alt"></i> Reset Tag (Riporta a pagina iniziale)`;
          btnReset.disabled = false;
        }
      }
    }

    // --- VISTA PUBBLICA ---
    function renderPublicCard(tagRecord) {
      const app = document.getElementById('app');
      const config = tagRecord.data || {};
      const mode = config.mode || 'card';

      const bgColor = config.colorAssignments?.bg || '#f5f5dc';
      const accentColor = config.colorAssignments?.accent || '#ffffff';
      const textColor = config.colorAssignments?.text || '#0f172a';

      document.body.style.backgroundColor = bgColor;

      if (mode === 'redirect') {
        let dest = config.url || '';
        if (dest && !dest.startsWith('http://') && !dest.startsWith('https://')) dest = 'https://' + dest;
        if (dest) window.location.href = dest;
        app.innerHTML = `<div class="bg-slate-800 p-8 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
          <i class="fas fa-spinner fa-spin text-4xl text-blue-400 mb-4"></i>
          <p class="text-base font-semibold">Reindirizzamento in corso...</p>
        </div>`;
        return;
      }

      if (mode === 'call') {
        const phone = config.phone || '';
        if (phone) window.location.href = 'tel:' + phone;
        app.innerHTML = `<div class="bg-slate-800 p-8 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
          <i class="fas fa-phone text-4xl text-green-400 mb-4"></i>
          <p class="text-base font-semibold">Avvio chiamata a ${phone}...</p>
        </div>`;
        return;
      }

      if (mode === 'whatsapp') {
        const num = (config.waNum || '').replace(/[^0-9]/g, '');
        const msg = encodeURIComponent(config.waMsg || '');
        window.location.href = `https://wa.me/${num}${msg ? '?text=' + msg : ''}`;
        app.innerHTML = `<div class="bg-slate-800 p-8 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
          <i class="fab fa-whatsapp text-4xl text-green-500 mb-4"></i>
          <p class="text-base font-semibold">Apertura Chat WhatsApp...</p>
        </div>`;
        return;
      }

      if (mode === 'photo') {
        app.innerHTML = `
          <div class="bg-slate-800 p-5 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
            <img src="${config.photoUrl}" class="w-full rounded-2xl mb-4 object-cover max-h-[70vh]" alt="Foto">
            <button onclick="promptForEdit('${tagRecord.tag_id}', '${tagRecord.pin}')" class="text-xs text-slate-400 hover:text-white transition mt-2">Modifica Pagina</button>
          </div>`;
        return;
      }

      if (mode === 'pdf') {
        let pdfDest = config.pdfUrl || '#';
        if (pdfDest !== '#' && !pdfDest.startsWith('http://') && !pdfDest.startsWith('https://')) pdfDest = 'https://' + pdfDest;
        app.innerHTML = `
          <div class="bg-slate-800 p-6 rounded-3xl shadow-2xl text-center border border-slate-700 text-white">
            <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
              <i class="fas fa-file-pdf"></i>
            </div>
            <h2 class="text-xl font-bold mb-4">${config.pdfTitle || 'Documento PDF'}</h2>
            <a href="${pdfDest}" target="_blank" rel="noopener noreferrer" class="block w-full py-3.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl shadow-lg transition mb-4">
              <i class="fas fa-download mr-2"></i> Apri / Scarica PDF
            </a>
            <button onclick="promptForEdit('${tagRecord.tag_id}', '${tagRecord.pin}')" class="text-xs text-slate-400 hover:text-white transition">Modifica Pagina</button>
          </div>`;
        return;
      }

      // BIGLIETTO DA VISITA
      let socialLinksHTML = '';
      if (config.instagram) socialLinksHTML += createSocialBtn(`https://instagram.com/${config.instagram.replace('@','')}`, 'fab fa-instagram', 'Instagram', accentColor, textColor);
      if (config.tiktok) socialLinksHTML += createSocialBtn(`https://tiktok.com/@${config.tiktok.replace('@','')}`, 'fab fa-tiktok', 'TikTok', accentColor, textColor);
      if (config.whatsapp) socialLinksHTML += createSocialBtn(`https://wa.me/${config.whatsapp.replace(/[^0-9]/g,'')}`, 'fab fa-whatsapp', 'WhatsApp', accentColor, textColor);
      if (config.linkedin) {
        let lUrl = config.linkedin;
        if (!lUrl.startsWith('http')) lUrl = 'https://' + lUrl;
        socialLinksHTML += createSocialBtn(lUrl, 'fab fa-linkedin', 'LinkedIn', accentColor, textColor);
      }

      const avatarImg = config.avatarUrl;
      const avatarHTML = avatarImg 
        ? `<img src="${avatarImg}" class="w-24 h-24 rounded-full mx-auto mb-4 object-cover border-4 border-slate-900/20 shadow-lg">`
        : `<div class="w-24 h-24 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl font-bold shadow-lg" style="background:${accentColor}; color:${textColor}">${(config.name || 'U')[0]}</div>`;

      app.innerHTML = `
        <div class="glass p-6 rounded-3xl shadow-2xl text-center border border-slate-900/10" style="color:${textColor}">
          ${avatarHTML}
          <h1 class="text-2xl font-bold tracking-tight">${config.name || 'Nome Cognome'}</h1>
          <p class="text-sm opacity-80 mb-6 font-medium">${config.title || ''}</p>

          <div class="space-y-3 mb-6">
            ${config.phone ? `<a href="tel:${config.phone}" class="block w-full py-3 px-4 rounded-xl bg-slate-900/10 hover:bg-slate-900/20 transition flex items-center justify-center gap-2 font-medium" style="border:1px solid ${textColor}30"><i class="fas fa-phone text-sm opacity-70"></i> ${config.phone}</a>` : ''}
            ${config.email ? `<a href="mailto:${config.email}" class="block w-full py-3 px-4 rounded-xl bg-slate-900/10 hover:bg-slate-900/20 transition flex items-center justify-center gap-2 font-medium break-all" style="border:1px solid ${textColor}30"><i class="fas fa-envelope text-sm opacity-70"></i> ${config.email}</a>` : ''}
          </div>

          ${socialLinksHTML ? `<div class="flex flex-col gap-2.5 mb-6">${socialLinksHTML}</div>` : ''}

          <button onclick="downloadVCard('${escapeJsStr(config.name)}', '${escapeJsStr(config.phone)}', '${escapeJsStr(config.email)}')" class="w-full py-3.5 rounded-xl font-bold shadow-lg transition hover:brightness-110 active:scale-95" style="background:${accentColor}; color:${textColor}; border: 1px solid ${textColor}20">
            <i class="fas fa-user-plus mr-2"></i> Salva in Rubrica
          </button>

          <div class="mt-6 pt-4 border-t border-slate-900/10 flex items-center justify-between opacity-60 hover:opacity-100 transition text-xs font-semibold">
            <span>Tag ID: ${tagRecord.tag_id}</span>
            <button onclick="promptForEdit('${tagRecord.tag_id}', '${tagRecord.pin}')" class="hover:underline flex items-center gap-1">
              <i class="fas fa-lock"></i> Modifica Pagina
            </button>
          </div>
        </div>
      `;
    }

    function promptForEdit(id, correctPin) {
      const inputPin = prompt("Inserisci il tuo PIN di 4 cifre per modificare la pagina:");
      if (inputPin === correctPin) {
        _supabase.from('tags').select('*').eq('tag_id', id).single().then(({ data }) => {
          renderConfiguratorForm(id, correctPin, data?.data);
        });
      } else if (inputPin !== null) {
        alert("PIN errato!");
      }
    }

    function escapeJsStr(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function createSocialBtn(url, iconClass, label, accentColor, textColor) {
      return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="w-full py-3 px-4 rounded-xl bg-slate-900/10 hover:bg-slate-900/20 transition flex items-center justify-between font-medium" style="border: 1px solid ${textColor}30">
                <span class="flex items-center gap-3"><i class="${iconClass} text-xl"></i> ${label}</span>
                <i class="fas fa-external-link-alt text-xs opacity-50"></i>
              </a>`;
    }

    function downloadVCard(name, phone, email) {
      const vcard = `BEGIN:VCARD\nVERSION:3.0\nN:;${name || ''};;;\nFN:${name || ''}\nTEL;TYPE=CELL:${phone || ''}\nEMAIL:${email || ''}\nEND:VCARD`;
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(name || 'contatto').replace(/\s+/g, '_')}.vcf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxDim = 300;
            let width = img.width, height = img.height;
            if (width > height) { if (width > maxDim) { height *= maxDim / width; width = maxDim; } }
            else { if (height > maxDim) { width *= maxDim / height; height = maxDim; } }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            uploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.65);
            document.getElementById('imagePreview').src = uploadedImageBase64;
            document.getElementById('imagePreviewContainer').classList.remove('hidden');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function setTarget(targetKey) {
      activeColorTarget = targetKey;
      ['bg', 'accent', 'text'].forEach(t => {
        const btn = document.getElementById(`target-${t}`);
        if (btn) btn.className = (t === targetKey) 
          ? "py-2 px-1 text-[11px] font-bold rounded-xl border border-blue-500 bg-blue-600/30 text-blue-300 flex flex-col items-center gap-1"
          : "py-2 px-1 text-[11px] font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400 flex flex-col items-center gap-1";
      });
      renderColorDots();
    }

    function renderColorDots() {
      const container = document.getElementById('colorDotsContainer');
      if (!container) return;
      container.innerHTML = ALLOWED_COLORS.map(c => `
        <div onclick="assignColor('${c.hex}')" class="color-dot ${colorAssignments[activeColorTarget] === c.hex ? 'selected' : ''}" style="background-color: ${c.hex}; ${c.hex === '#ffffff' ? 'border-color:#cbd5e1' : ''}" title="${c.name}"></div>
      `).join('');
    }

    function assignColor(hex) {
      colorAssignments[activeColorTarget] = hex;
      const prevEl = document.getElementById(`preview-${activeColorTarget}`);
      if (prevEl) prevEl.style.backgroundColor = hex;
      renderColorDots();
    }

    function handleCustomColorChoice(event) {
      const customHex = event.target.value;
      if (!ALLOWED_COLORS.some(c => c.hex === customHex)) ALLOWED_COLORS.push({ name: 'Personalizzato', hex: customHex });
      assignColor(customHex);
    }
  </script>
</body>
</html>
